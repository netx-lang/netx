name: Benchmark

# Continuous nxsim benchmark. Results are deterministic (Callgrind with cache
# simulation), so the stored baseline and the PR run are comparable across
# machines. Reporting/history/alerts are handled by github-action-benchmark.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'simulator/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
    inputs:
      designs:
        description: 'Space-separated design list'
        required: false
        default: 'rv32i ddr2 ethmac sha256 axi fft aes128 chain fanin fanout register_bank'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  compare:
    name: Benchmark
    # Fork PRs cannot read the deploy key, so they are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15 cmake build-essential valgrind \
              libboost-all-dev nlohmann-json3-dev libssl-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 20
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 20
          g++ --version

      - name: Build nx compiler
        run: ./gradlew installDist --no-daemon

      - name: Clone benchmark designs
        run: git clone --depth 1 https://github.com/netx-lang/benchmarks.git "$RUNNER_TEMP/benchmarks"

      # nx fetches netx-std with JGit, which reads ~/.ssh/id_* directly and does not
      # use the SSH agent (no ConnectorFactory provider is registered on the
      # classpath), so webfactory/ssh-agent would not work here.
      - name: Set up netx-std deploy key
        env:
          NETX_STD_DEPLOY_KEY: ${{ secrets.NETX_STD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NETX_STD_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Run benchmark
        env:
          NETX_BENCHMARKS_DIR: ${{ runner.temp }}/benchmarks
          NX_BIN: ${{ github.workspace }}/build/install/nx/bin/nx
          BENCH_MODE: callgrind
          BENCH_FORMAT: gh-action
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            export BENCH_DESIGNS="${{ github.event.inputs.designs }}"
          fi
          simulator/benchmark/compare.sh HEAD > bench.json
          cat bench.json

      - name: Store / compare benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-always: ${{ github.event_name == 'pull_request' }}
          alert-threshold: '105%'
          fail-on-alert: false
          summary-always: true

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxsim-benchmark
          path: bench.json
          if-no-files-found: ignore
