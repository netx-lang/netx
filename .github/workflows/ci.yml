name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      rust: ${{ steps.filter.outputs.rust }}
      cpp: ${{ steps.filter.outputs.cpp }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          java:
            - 'src/**'
            - 'compiler/**'
            - 'backend/**'
            - 'build.gradle*'
            - 'settings.gradle*'
            - 'gradle/**'
            - 'gradlew'
            - 'gradlew.bat'
          rust:
            - 'prob-analysis/**'
          cpp:
            - 'simulator/**'
            - 'CMakeLists.txt'

  java-tests:
    name: Run Java Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.java == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Run Java tests
      run: ./gradlew test --parallel --continue

  rust-tests:
    name: Run Rust Analyzer Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          prob-analysis/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('prob-analysis/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run clippy
      working-directory: prob-analysis
      run: cargo clippy --all-targets -- -D warnings

    - name: Run Rust tests
      working-directory: prob-analysis
      run: cargo test

  cpp-tests:
    name: Run C++ Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.cpp == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt update
        sudo apt install -y g++-14 cmake build-essential
        sudo apt install -y libboost-all-dev nlohmann-json3-dev libgtest-dev libgmock-dev
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

    - name: Configure CMake
      working-directory: simulator
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTESTING=ON

    - name: Build C++ project
      working-directory: simulator
      run: cmake --build build --parallel

    - name: Run C++ tests
      working-directory: simulator
      run: ctest --test-dir build --output-on-failure
