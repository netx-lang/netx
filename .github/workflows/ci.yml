name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  java-tests:
    name: Run Java Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Run Java tests
      run: ./gradlew test --parallel --continue

  cpp-tests:
    name: Run C++ Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt update
        sudo apt install -y g++-15 cmake build-essential
        sudo apt install -y libboost-all-dev nlohmann-json3-dev libgtest-dev libgmock-dev
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 10

    - name: Configure CMake
      working-directory: simulator
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTESTING=ON

    - name: Build C++ project
      working-directory: simulator
      run: cmake --build build --parallel

    - name: Run C++ tests
      working-directory: simulator
      run: ctest --test-dir build --output-on-failure
