<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <title>Visualizer</title>
    <style>
        svg {
            width: 100%;
            height: 100vh;
            border: 1px solid black;
        }

        .wire {
            fill: lightblue;
            stroke: black;
            stroke-width: 1;
        }

        .component, .builtin, .instantiate {
            fill: lightgray;
            stroke: black;
            stroke-width: 2;
        }

        text {
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<svg></svg>
<script>
    fetch('/graph')
        .then(response => response.json())
        .then(data => {
            visualize(data);
        })
        .catch(error => console.error('Failed to load graph data:', error));

    function visualize(graphData) {
        const svg = d3.select("svg");
        const width = +svg.node().clientWidth;
        const height = +svg.node().clientHeight;

        const zoomGroup = svg.append("g").attr("class", "zoom-group");
        svg.call(d3.zoom().on("zoom", (event) => {
            zoomGroup.attr("transform", event.transform);
        }));

        const componentMap = new Map();
        graphData.forEach(component => {
            if (!componentMap.has(component.id)) {
                componentMap.set(component.id, new Map())
            }
            componentMap.get(component.id).set(component.defIndex, component);
        });
        console.log(componentMap);

        renderComponent(graphData[0], zoomGroup, width / 2, height / 2);

        function renderComponent(data, parentGroup, x, y) {
            const componentGroup = parentGroup.append("g")
                .attr("class", "component-group")
                .attr("transform", `translate(${x}, ${y})`);

            const rectWidth = 200;
            const rectHeight = 100;

            componentGroup.append("rect")
                .attr("class", data.type)
                .attr("width", rectWidth)
                .attr("height", rectHeight)
                .attr("x", -rectWidth / 2)
                .attr("y", -rectHeight / 2)
                .on("click", (event) => {
                    event.stopPropagation();
                    if (data.expanded) {
                        collapseComponent(componentGroup);
                        data.expanded = false;
                    } else {
                        data.expanded = true;
                        renderSubcomponents(data.members, componentGroup, rectWidth, rectHeight);
                    }
                });

            componentGroup.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", 5)
                .text(data.id);

            if (data.input) {
                data.input.forEach((input, index) => {
                    componentGroup.append("rect")
                        .attr("class", "wire")
                        .attr("width", 10)
                        .attr("height", 10)
                        .attr("x", -rectWidth / 2 - 20)
                        .attr("y", -rectHeight / 2 + 20 * index);
                    componentGroup.append("text")
                        .attr("x", -rectWidth / 2 - 25)
                        .attr("y", -rectHeight / 2 + 20 * index + 5)
                        .attr("text-anchor", "end")
                        .text(input);
                });
            }

            if (data.output) {
                data.output.forEach((output, index) => {
                    componentGroup.append("rect")
                        .attr("class", "wire")
                        .attr("width", 10)
                        .attr("height", 10)
                        .attr("x", rectWidth / 2 + 10)
                        .attr("y", -rectHeight / 2 + 20 * index);
                    componentGroup.append("text")
                        .attr("x", rectWidth / 2 + 25)
                        .attr("y", -rectHeight / 2 + 20 * index + 5)
                        .attr("text-anchor", "start")
                        .text(output);
                });
            }

            return componentGroup;
        }

        function renderSubcomponents(members, parentGroup, parentWidth, parentHeight) {
            const subGroup = parentGroup.append("g").attr("class", "subcomponent-group");
            members.forEach((member, index) => {
                if (member.type === "component" || member.type === "builtin") {
                    const xOffset = parentWidth + 100;
                    const yOffset = (index - members.length / 2) * 150;
                    renderComponent(member, subGroup, xOffset, yOffset);

                    parentGroup.append("line")
                        .attr("x1", parentWidth / 2)
                        .attr("y1", 0)
                        .attr("x2", xOffset - 100)
                        .attr("y2", yOffset)
                        .attr("stroke", "#aaa")
                        .attr("stroke-width", 1);
                } else if (member.type === "instantiate") {
                    const memberID = member.id.split('@')[0];
                    const resolvedComponentMap = componentMap.get(memberID);
                    if (resolvedComponentMap) {
                        const resolvedComponent = resolvedComponentMap.get(member.defIndex);
                        if (resolvedComponent) {
                            const resolvedData = { ...resolvedComponent, id: member.id, input: member.input, output: member.output };
                            const xOffset = parentWidth + 100;
                            const yOffset = (index - members.length / 2) * 150;
                            renderComponent(resolvedData, subGroup, xOffset, yOffset);

                            parentGroup.append("line")
                                .attr("x1", parentWidth / 2)
                                .attr("y1", 0)
                                .attr("x2", xOffset - 100)
                                .attr("y2", yOffset)
                                .attr("stroke", "#aaa")
                                .attr("stroke-width", 1);
                        } else {
                            console.warn(`Component not found: ${memberID} with defIndex ${member.defIndex}`);
                        }
                    } else {
                        console.warn(`Component map not found for: ${memberID}`);
                    }
                }
            });
        }


        function collapseComponent(componentGroup) {
            componentGroup.selectAll(".subcomponent-group").remove(); // Remove all subcomponents
            componentGroup.selectAll("line").remove(); // Remove all connecting lines
        }
    }
</script>
</body>
</html>
